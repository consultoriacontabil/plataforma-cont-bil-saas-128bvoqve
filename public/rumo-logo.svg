<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0FA3A3"/>
      <stop offset="100%" stopColor="#123B6D"/>
    </linearGradient>
    <linearGradient id="accent" x1="32" y1="32" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#5EEAD4"/>
      <stop offset="100%" stopColor="#2DD4BF"/>
    </linearGradient>
  </defs>

  <!-- Background rounded card -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>

  <!-- Compass dashed outer ring -->
  <circle cx="32" cy="32" r="23" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.35" stroke-dasharray="8 4"/>

  <!-- Cardinal navigation markers -->
  <line x1="32" y1="4" x2="32" y2="9" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="55" x2="32" y2="60" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="4" y1="32" x2="9" y2="32" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="55" y1="32" x2="60" y2="32" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6"/>

  <!-- Monogram R column -->
  <path d="M19 15C19 13.8954 19.8954 13 21 13H24C25.1046 13 26 13.8954 26 15V49C26 50.1046 25.1046 51 24 51H21C19.8954 51 19 50.1046 19 49V15Z" fill="#FFFFFF"/>

  <!-- Monogram R loop / compass heading -->
  <path d="M24 13H36C41.5228 13 46 17.4772 46 23C46 28.5228 41.5228 33 36 33H24V13Z" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>

  <!-- Dynamic vector / leg pointing SE -->
  <path d="M30 31L45.5 50.5C46.3 51.5 47.7 51.5 48.5 50.5L49.5 49.2C50.2 48.2 50.1 46.8 49 45.8L35.5 29.5" fill="url(#accent)" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- North star pointer / needle head -->
  <polygon points="32,18 37,29 32,26.5 27,29" fill="#FFFFFF"/>
</svg>
